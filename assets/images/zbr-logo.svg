<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Lightning bolt / flash symbol integrated with delivery motion -->
  <g transform="translate(256, 256)">
    <!-- Speed lines (left side) -->
    <rect x="-180" y="-20" width="60" height="8" rx="4" fill="white" opacity="0.6"/>
    <rect x="-160" y="0" width="40" height="8" rx="4" fill="white" opacity="0.4"/>
    <rect x="-170" y="20" width="50" height="8" rx="4" fill="white" opacity="0.5"/>

    <!-- Lightning bolt -->
    <path d="M -20 -100 L 60 -10 L 10 -10 L 50 100 L -30 10 L 20 10 Z"
          fill="url(#flashGrad)"
          stroke="white"
          stroke-width="4"/>
  </g>

  <!-- ZBR text at bottom -->
  <text x="256" y="420"
        font-family="Arial Black, Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        letter-spacing="8">ZBR</text>

  <!-- Subtitle -->
  <text x="256" y="455"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="600"
        fill="white"
        text-anchor="middle"
        opacity="0.9">COURIER</text>
</svg>
