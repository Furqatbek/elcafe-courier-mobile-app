<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGrad)"/>

  <!-- Lightning bolt -->
  <path d="M 430 180 L 640 430 L 530 430 L 600 844 L 390 530 L 500 530 Z"
        fill="url(#flashGrad)"
        stroke="white"
        stroke-width="16"/>

  <!-- Speed lines -->
  <rect x="120" y="430" width="165" height="32" rx="16" fill="white" opacity="0.6"/>
  <rect x="165" y="490" width="120" height="32" rx="16" fill="white" opacity="0.4"/>
  <rect x="140" y="550" width="145" height="32" rx="16" fill="white" opacity="0.5"/>
</svg>
