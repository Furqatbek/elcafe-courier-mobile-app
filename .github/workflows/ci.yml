name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # npm, matching how releases are actually built. This job used to install
      # with bun while the release AAB was built locally with npm, so CI was
      # verifying a different dependency tree than the one that shipped. Two
      # lock files also meant `expo install` updated whichever one it detected
      # and left the other stale — which is exactly how expo-asset ended up
      # missing from package-lock.json.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
